name: Generate AI Daily

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "ai-daily"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser fallback
        run: |
          python -m pip install playwright
          python -m playwright install chromium

      - name: Generate daily content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ai-daily/fetch.py

      - name: Commit generated files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ai-daily data/ai-daily

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update ai daily"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Hugo deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          curl --request POST \
            --url "https://api.github.com/repos/${REPO}/actions/workflows/hugo.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"ref\":\"${REF_NAME}\"}"
